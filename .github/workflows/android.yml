name: COINT Android development build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Prepare pinned upstream native engine
        shell: pwsh
        run: ./scripts/Prepare-Engine.ps1
      - name: Build app and run tests
        run: bash ./gradlew :app_pojavlauncher:assembleDebug :app_pojavlauncher:testDebugUnitTest -PcointPrebuiltEngine=true --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: coint-launcher-android-dev
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app_pojavlauncher/build/test-results/testDebugUnitTest/
